// ── Auth state UI ─────────────────────────────────────────
auth.onAuthStateChanged(user => {
  const statusEl = document.getElementById('authStatus');
  const ctrlEl   = document.getElementById('authControls');
  const seedBtn  = document.getElementById('btnSeed');
  if (user) {
    statusEl.innerHTML = `✅ Signed in as <strong>${user.displayName || user.email || user.uid}</strong>`;
    ctrlEl.innerHTML = `<button onclick="auth.signOut()">Sign out</button>`;
    seedBtn.disabled = false;
  } else {
    statusEl.textContent = '🔒 Not signed in';
    ctrlEl.innerHTML = `
      <button onclick="signInGoogle()">Sign in with Google</button>
      <span style="margin:0 8px;color:#666">or</span>
      <input id="em" placeholder="email" style="padding:8px;border-radius:4px;border:1px solid #2d5a7b;background:#111;color:#eee;width:200px">
      <input id="pw" placeholder="password" type="password" style="padding:8px;border-radius:4px;border:1px solid #2d5a7b;background:#111;color:#eee;width:140px">
      <button onclick="signInEmail()">Sign in</button>`;
    seedBtn.disabled = true;
  }
});
function signInGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>alert(e.message)); }
function signInEmail() { auth.signInWithEmailAndPassword(document.getElementById('em').value, document.getElementById('pw').value).catch(e=>alert(e.message)); }

// ── Logging ───────────────────────────────────────────────
const logEl = document.getElementById('log');
function log(msg, cls='') {
  const s = document.createElement('span');
  if (cls) s.className = cls;
  s.textContent = msg + '\n';
  logEl.appendChild(s);
  logEl.scrollTop = logEl.scrollHeight;
}

// ═══════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════
function slug(name) {
  return 'mn26-' + name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+$/,'');
}

// Score is winner-first format (21-10 means winner got 21, loser got 10)
// We store as s1=team1_score, s2=team2_score
function parseScore(s, team1Won) {
  const sets = [{s1:null,s2:null},{s1:null,s2:null},{s1:null,s2:null}];
  if (!s) return sets;
  s.split(',').forEach((part, i) => {
    if (i >= 3) return;
    const [a,b] = part.trim().split('-').map(Number);
    if (!isNaN(a) && !isNaN(b)) {
      sets[i] = team1Won ? {s1:a, s2:b} : {s1:b, s2:a};
    }
  });
  return sets;
}

function setsWonFrom(sets) {
  let w1=0, w2=0;
  sets.forEach(s => {
    if (s.s1 !== null && s.s2 !== null) { if (s.s1 > s.s2) w1++; else w2++; }
  });
  return {w1, w2};
}

function computeRatings(st) {
  const m = st.matches || 0;
  if (!m) return {overall:5, winRate:5, clutch:5, dominance:5, tournament:5};
  const total = (st.setsWon||0) + (st.setsLost||0);
  const winRate    = (st.wins / m) * 10;
  const clutch     = st.set3Apps > 0 ? (st.set3Wins / st.set3Apps) * 10 : 5;
  const dominance  = total > 0 ? (st.setsWon / total) * 10 : 5;
  const t          = st.tournamentsPlayed || 1;
  const perfPts    = (st.championCount||0)*3 + (st.finalistCount||0)*2 + (st.semifinalistCount||0);
  const tournament = Math.min(10, (perfPts / t) * 3.5);
  const overall    = winRate*0.35 + clutch*0.20 + dominance*0.30 + tournament*0.15;
  const r = v => Math.round(v*10)/10;
  return {overall:r(overall), winRate:r(winRate), clutch:r(clutch), dominance:r(dominance), tournament:r(tournament)};
}

function emptyStats() {
  return {matches:0, wins:0, setsWon:0, setsLost:0, set3Apps:0, set3Wins:0,
          tournamentsPlayed:0, championCount:0, finalistCount:0, semifinalistCount:0};
}

// Build per-event stats from a match list + team map + placement arrays
function buildEventStats(matches, teamMap, champions, runnersUp, semis) {
  const stats = {}; // name → stats
  function init(name) { if (!stats[name]) stats[name] = emptyStats(); }

  matches.forEach(m => {
    const sets = parseScore(m.score, m.wt === 1);
    const {w1,w2} = setsWonFrom(sets);
    const is3 = (w1+w2) === 3;
    const t1won = m.wt === 1;
    const t1p = teamMap[m.t1] || [];
    const t2p = teamMap[m.t2] || [];
    t1p.forEach(name => {
      init(name);
      stats[name].matches++;  stats[name].setsWon += w1;  stats[name].setsLost += w2;
      if (t1won) stats[name].wins++;
      if (is3) { stats[name].set3Apps++; if(t1won) stats[name].set3Wins++; }
    });
    t2p.forEach(name => {
      init(name);
      stats[name].matches++;  stats[name].setsWon += w2;  stats[name].setsLost += w1;
      if (!t1won) stats[name].wins++;
      if (is3) { stats[name].set3Apps++; if(!t1won) stats[name].set3Wins++; }
    });
  });

  // Any player who appeared in at least one match played 1 tournament
  Object.keys(stats).forEach(name => { stats[name].tournamentsPlayed = 1; });

  champions.forEach(team  => { (teamMap[team]||[]).forEach(n => { if(stats[n]) stats[n].championCount++;   }); });
  runnersUp.forEach(team  => { (teamMap[team]||[]).forEach(n => { if(stats[n]) stats[n].finalistCount++;   }); });
  semis.forEach(team      => { (teamMap[team]||[]).forEach(n => { if(stats[n]) stats[n].semifinalistCount++; }); });

  return stats;
}

// Merge two stats objects (for computing overall cross-event stats)
function mergeStats(a, b) {
  const keys = ['matches','wins','setsWon','setsLost','set3Apps','set3Wins',
                 'tournamentsPlayed','championCount','finalistCount','semifinalistCount'];
  const out = emptyStats();
  keys.forEach(k => { out[k] = (a[k]||0) + (b[k]||0); });
  return out;
}

// ═══════════════════════════════════════════════════════════
//  SEED
// ═══════════════════════════════════════════════════════════
async function runSeed() {
  document.getElementById('btnSeed').disabled = true;
  const user = await new Promise(resolve => {
    const unsub = auth.onAuthStateChanged(u => { unsub(); resolve(u); });
  });
  if (!user) {
    log('✗ Not signed in.', 'err');
    document.getElementById('btnSeed').disabled = false;
    return;
  }
  log(`Signed in as: ${user.displayName || user.email}`, 'ok');

  // Compute per-event stats
  const mdStats = buildEventStats(MD_MATCHES, MD_TEAM_MAP, MD_CHAMPIONS, MD_RUNNERS_UP, MD_SEMIS);
  const xdStats = buildEventStats(XD_MATCHES, XD_TEAM_MAP, XD_CHAMPIONS, XD_RUNNERS_UP, XD_SEMIS);
  const wdStats = buildEventStats(WD_MATCHES, WD_TEAM_MAP, WD_CHAMPIONS, WD_RUNNERS_UP, WD_SEMIS);
  const wsStats = buildEventStats(WS_MATCHES, WS_TEAM_MAP, WS_CHAMPIONS, WS_RUNNERS_UP, WS_SEMIS);
  const msStats = buildEventStats(MS_MATCHES, MS_TEAM_MAP, MS_CHAMPIONS, MS_RUNNERS_UP, MS_SEMIS);

  // All unique player names across all events
  const allNames = [...new Set([...MD_PLAYER_NAMES, ...XD_NEW_PLAYER_NAMES, ...WD_NEW_PLAYER_NAMES, ...WS_NEW_PLAYER_NAMES, ...MS_NEW_PLAYER_NAMES])];

  // ── Stats summary ──
  const evCounts = {md:0, xd:0, wd:0, ws:0, ms:0};
  allNames.forEach(n => {
    if ((mdStats[n]||{}).matches > 0) evCounts.md++;
    if ((xdStats[n]||{}).matches > 0) evCounts.xd++;
    if ((wdStats[n]||{}).matches > 0) evCounts.wd++;
    if ((wsStats[n]||{}).matches > 0) evCounts.ws++;
    if ((msStats[n]||{}).matches > 0) evCounts.ms++;
  });
  log(`Stats computed — md:${evCounts.md} xd:${evCounts.xd} wd:${evCounts.wd} ws:${evCounts.ws} ms:${evCounts.ms} (total names: ${allNames.length})`, 'ok');

  // ── Step 1: Create/link player profiles ──
  log('\n── Step 1: Creating player profiles ──', 'hdr');
  const playerIdMap = {};

  for (const name of allNames) {
    // Check for existing profile by displayName
    let existingId = null;
    try {
      const q = await db.collection('webPlayers').where('displayName', '==', name).limit(1).get();
      if (!q.empty) existingId = q.docs[0].id;
    } catch(e) { log(`  ⚠ lookup ${name}: ${e.message}`, 'err'); }

    const id = existingId || slug(name);
    playerIdMap[name] = id;

    const st_md  = mdStats[name]  || emptyStats();
    const st_xd  = xdStats[name]  || emptyStats();
    const st_wd  = wdStats[name]  || emptyStats();
    const st_ws  = wsStats[name]  || emptyStats();
    const st_ms  = msStats[name]  || emptyStats();
    const st_all = mergeStats(mergeStats(mergeStats(mergeStats(st_md, st_xd), st_wd), st_ws), st_ms);
    const hasMd  = st_md.matches > 0;
    const hasXd  = st_xd.matches > 0;
    const hasWd  = st_wd.matches > 0;
    const hasWs  = st_ws.matches > 0;
    const hasMs  = st_ms.matches > 0;

    const profileData = {
      displayName: name,
      photoURL: null,
      linkedUID: null,
      stats: st_all,
      ratings: computeRatings(st_all),
      statsByEvent: {},
      ratingsByEvent: {},
      h2h: {},
    };
    if (hasMd) { profileData.statsByEvent.md = st_md; profileData.ratingsByEvent.md = computeRatings(st_md); }
    if (hasXd) { profileData.statsByEvent.xd = st_xd; profileData.ratingsByEvent.xd = computeRatings(st_xd); }
    if (hasWd) { profileData.statsByEvent.wd = st_wd; profileData.ratingsByEvent.wd = computeRatings(st_wd); }
    if (hasWs) { profileData.statsByEvent.ws = st_ws; profileData.ratingsByEvent.ws = computeRatings(st_ws); }
    if (hasMs) { profileData.statsByEvent.ms = st_ms; profileData.ratingsByEvent.ms = computeRatings(st_ms); }

    try {
      if (existingId) {
        // Merge into existing — update stats/ratings, preserve linkedUID/photoURL
        await db.collection('webPlayers').doc(id).update({
          stats: profileData.stats,
          ratings: profileData.ratings,
          statsByEvent: profileData.statsByEvent,
          ratingsByEvent: profileData.ratingsByEvent,
        });
        log(`  ↩ updated  ${name.padEnd(34)} md:${hasMd?st_md.matches+'M':'-'} wd:${hasWd?st_wd.matches+'M':'-'} xd:${hasXd?st_xd.matches+'M':'-'} ws:${hasWs?st_ws.matches+'M':'-'} ms:${hasMs?st_ms.matches+'M':'-'} overall:${profileData.ratings.overall}`, 'ok');
      } else {
        profileData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        await db.collection('webPlayers').doc(id).set(profileData);
        log(`  ✓ created  ${name.padEnd(34)} md:${hasMd?st_md.matches+'M':'-'} wd:${hasWd?st_wd.matches+'M':'-'} xd:${hasXd?st_xd.matches+'M':'-'} ws:${hasWs?st_ws.matches+'M':'-'} ms:${hasMs?st_ms.matches+'M':'-'} overall:${profileData.ratings.overall}`, 'ok');
      }
    } catch(e) {
      log(`  ✗ ${name}: ${e.message}`, 'err');
    }
  }

  // ── Step 2: Create/update tournament ──
  log('\n── Step 2: Creating tournament ──', 'hdr');
  try {
    // Check if tournament with same name already exists
    const existing = await db.collection('webTournaments')
      .where('name', '==', '2026 MN Hmong Tournament').limit(1).get();
    let ref;
    if (!existing.empty) {
      ref = db.collection('webTournaments').doc(existing.docs[0].id);
      const { doc } = buildTournamentDoc(playerIdMap);
      await ref.update({ events: doc.events, eventData: doc.eventData, status: doc.status });
      log(`  ↩ Tournament updated: ${ref.id}`, 'ok');
    } else {
      const built = buildTournamentDoc(playerIdMap);
      ref = built.ref;
      await ref.set(built.doc);
      log(`  ✓ Tournament created: ${ref.id}`, 'ok');
    }
    log(`  → https://athletebridge-63176.web.app/tournament/?id=${ref.id}`, 'ok');
  } catch(e) {
    log(`  ✗ Tournament: ${e.message}`, 'err');
  }

  log('\n✓ Seed complete!', 'ok');
  document.getElementById('btnSeed').disabled = false;
}
