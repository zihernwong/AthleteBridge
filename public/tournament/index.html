async function submitRegistration(){
  const name=document.getElementById('regName')?.value.trim();
  const email=document.getElementById('regEmail')?.value.trim();
  const note=document.getElementById('regNote')?.value.trim();
  if(!name){const e=document.getElementById('regErr');if(e){e.textContent='Name required';e.style.display='block';}return;}
  const ed=getED(localT);
  const already=(ed.registrations||[]).some(r=>r.name.toLowerCase()===name.toLowerCase());
  if(already){const e=document.getElementById('regErr');if(e){e.textContent='Already registered';e.style.display='block';}return;}
  const reg={id:'R'+Date.now()+Math.random().toString(36).slice(2,5),name,email:email||'',note:note||'',status:'pending',playerUID:currentUser?.uid||null,submittedAt:Date.now()};
  const registrations=[...(ed.registrations||[]),reg];
  await saveED({registrations});
  document.getElementById('regOverlay')?.remove();
  toast('Registration submitted! The organizer will review your request.');
}

// ═══════════════════════════════════════════════════════════
//  COURT SCHEDULING
// ═══════════════════════════════════════════════════════════
function fmtTime(t24){if(!t24)return'';const[h,m]=t24.split(':').map(Number);return`${h%12||12}:${m.toString().padStart(2,'0')} ${h>=12?'PM':'AM'}`;}
function nowTimeStr(){const n=new Date();return`${n.getHours().toString().padStart(2,'0')}:${n.getMinutes().toString().padStart(2,'0')}`;}

function applyInitialSchedule(matches,startTime,numCourts){
  const ready=matches.filter(m=>m.p1&&m.p2&&!m.bye&&!m.win);
  for(let i=0;i<Math.min(numCourts,ready.length);i++){ready[i].court=i+1;ready[i].scheduledTime=startTime;}
}

function scheduleNextMatch(matches,freedCourt){
  const next=matches.find(m=>m.p1&&m.p2&&!m.bye&&!m.win&&!m.court);
  if(next){next.court=freedCourt;next.scheduledTime=nowTimeStr();}
}

// Courts tab — shows ALL events' matches across courts
function courtsTab(t){
  if(!t.numCourts){return`<div class="empty"><div class="ico">🏟️</div><h3>No Courts Configured</h3><p>Set the number of courts when creating the tournament.</p></div>`;}

  // Gather all matches across all events
  const allMatches=[];const pmap={};
  if(t.events&&t.events.length>0){
    t.events.forEach(ev=>{
      const ed=t.eventData?.[ev];
      if(ed?.bracket?.matches){
        (ed.players||[]).forEach(p=>{pmap[p.id]=p.name;});
        ed.bracket.matches.forEach(m=>allMatches.push({...m,eventName:EVENTS[ev]||ev}));
      }
    });
  }else if(t.bracket){
    (t.players||[]).forEach(p=>{pmap[p.id]=p.name;});
    t.bracket.matches.forEach(m=>allMatches.push({...m,eventName:''}));
  }

  if(!allMatches.length)return`<div class="empty"><div class="ico">🏟️</div><h3>Generate a Bracket First</h3><p>Courts will be assigned when brackets are generated.</p></div>`;

  const courts=Array.from({length:t.numCourts},(_,i)=>i+1).map(c=>{
    const active=allMatches.find(m=>m.court===c&&!m.win&&m.p1&&m.p2);
    const completed=allMatches.filter(m=>m.court===c&&m.win);
    const statusCls=active?'busy':'free';
    const statusLbl=active?'🟢 In Progress':'⚪ Available';
    const bodyHtml=active
      ?`<div class="ct-label">On Court Now</div><div class="ct-event">${esc(active.eventName||'')}</div><div class="ct-players">${esc(pmap[active.p1]||'?')} vs ${esc(pmap[active.p2]||'?')}</div><div class="ct-time">${active.scheduledTime?'Since '+fmtTime(active.scheduledTime):''}</div>`
      :`<div style="color:var(--muted);font-size:13px;padding-top:4px">Court is available</div>`;
    const histHtml=completed.length?`<div class="ct-done">${completed.length} match${completed.length!==1?'es':''} completed</div>`:'';
    return`<div class="ct"><div class="ct-hdr ${statusCls}"><span>Court ${c}</span><span style="font-size:12px;font-weight:400">${statusLbl}</span></div><div class="ct-body">${bodyHtml}${histHtml}</div></div>`;
  }).join('');

  const queue=allMatches.filter(m=>m.p1&&m.p2&&!m.bye&&!m.win&&!m.court);

  // Rest time conflict detection: flag players on 2 courts simultaneously or back-to-back < 15min
  const restWarnings=[];
  const activePids=new Set();
  allMatches.filter(m=>m.court&&!m.win&&m.p1&&m.p2).forEach(m=>{
    [m.p1,m.p2].forEach(pid=>{
      if(activePids.has(pid))restWarnings.push(`⚠️ ${esc(pmap[pid]||'?')} is on multiple active courts!`);
      activePids.add(pid);
    });
  });

  const restHtml=restWarnings.length?`<div class="card" style="margin-top:16px;border:2px solid #f59e0b">
    <div class="card-hdr" style="background:#fef3c7"><span class="card-title" style="color:#92400e">Rest Conflicts</span></div>
    <div class="card-body">${restWarnings.map(w=>`<div class="rest-warn" style="margin-bottom:6px">${w}</div>`).join('')}</div>
  </div>`:'';

  const queueHtml=queue.length?`<div class="card" style="margin-top:16px"><div class="card-hdr"><span class="card-title">Waiting Queue (${queue.length})</span></div><div class="card-body">${queue.slice(0,10).map(m=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px"><span><strong>${esc(pmap[m.p1]||'?')}</strong> vs <strong>${esc(pmap[m.p2]||'?')}</strong>${m.eventName?` <span style="color:var(--muted)">(${esc(m.eventName)})</span>`:''}</span><span style="color:var(--muted);font-size:12px">Waiting</span></div>`).join('')}</div></div>`:'';

  return`<div class="courts-grid">${courts}</div>${restHtml}${queueHtml}`;
}

// ── H2H ───────────────────────────────────────────────────
async function getH2H(uid1, uid2) {
  try {
    const d=await pRef(uid1).get();
    if(!d.exists)return null;
    const h2h=(d.data().h2h||{})[uid2];
    if(!h2h)return null;
    return{w1:h2h.wins||0,w2:h2h.losses||0};
  }catch(e){return null;}
}

async function updateH2H(winnerUID, loserUID) {
  if(!winnerUID||!loserUID)return;
  try {
    // Winner's record vs loser
    const wd=await pRef(winnerUID).get();
    if(wd.exists){const h2h={...(wd.data().h2h||{})};const prev=h2h[loserUID]||{wins:0,losses:0};h2h[loserUID]={wins:(prev.wins||0)+1,losses:prev.losses||0};await pRef(winnerUID).update({h2h});}
    // Loser's record vs winner
    const ld=await pRef(loserUID).get();
    if(ld.exists){const h2h={...(ld.data().h2h||{})};const prev=h2h[winnerUID]||{wins:0,losses:0};h2h[winnerUID]={wins:prev.wins||0,losses:(prev.losses||0)+1};await pRef(loserUID).update({h2h});}
  }catch(e){console.warn('h2h update failed',e);}
}

async function undoH2H(winnerUID, loserUID) {
  if(!winnerUID||!loserUID)return;
  try {
    const wd=await pRef(winnerUID).get();
    if(wd.exists){const h2h={...(wd.data().h2h||{})};const prev=h2h[loserUID]||{wins:0,losses:0};h2h[loserUID]={wins:Math.max(0,(prev.wins||0)-1),losses:prev.losses||0};await pRef(winnerUID).update({h2h});}
    const ld=await pRef(loserUID).get();
    if(ld.exists){const h2h={...(ld.data().h2h||{})};const prev=h2h[winnerUID]||{wins:0,losses:0};h2h[winnerUID]={wins:prev.wins||0,losses:Math.max(0,(prev.losses||0)-1)};await pRef(loserUID).update({h2h});}
  }catch(e){console.warn('h2h undo failed',e);}
}

// ── QR Code ───────────────────────────────────────────────
function showQR(url) {
  const u=url||(localT?`${location.origin}${location.pathname}?id=${localT.id}`:'');
  if(!u)return;
  document.getElementById('qrTitle').textContent=localT?`Share: ${localT.name}`:'Share';
  document.getElementById('qrUrl').textContent=u;
  const box=document.getElementById('qrBox');
  box.innerHTML='';
  try{new QRCode(box,{text:u,width:200,height:200,colorDark:'#1a1a2e',colorLight:'#ffffff'});}
  catch(e){box.innerHTML=`<div style="font-size:11px;color:var(--muted);padding:20px">QR unavailable</div>`;}
  document.getElementById('qrModal').style.display='flex';
}
function closeQR(){document.getElementById('qrModal').style.display='none';}

async function confirmDelete(id){
  if(!confirm(`Delete "${localT?.name}"? This cannot be undone.`))return;
  await deleteT(id);goList();toast('Tournament deleted');
}

function copyLink(){
  const url=`${location.origin}${location.pathname}?id=${localT?.id}`;
  navigator.clipboard?.writeText(url).then(()=>toast('Link copied!')).catch(()=>prompt('Copy this link:',url));
}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

let _tt;
function toast(msg){document.querySelector('.toast')?.remove();clearTimeout(_tt);const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);_tt=setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},2800);}

  const p=new URLSearchParams(location.search);
  const id=p.get('id'),player=p.get('player'),view=p.get('view'),state=p.get('state'),spectator=p.get('spectator'),series=p.get('series');
  if(spectator) goSpectator(spectator,false);
  else if(series) goSeriesDetail(series,false);
  else if(id) goTournament(id,false);
  else if(player) goPlayerProfile(player,false);
  else if(view==='players') goPlayers(false);
  else if(view==='auth') goAuth(false);
  else { listState=state||''; goList(undefined,false); }
});
