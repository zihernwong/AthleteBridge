<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Event Signup — AthleteBridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #111; background: #f5f5f5; padding: 24px; min-height: 100vh;
    }
    .card {
      max-width: 480px; margin: 30px auto; padding: 32px 24px;
      border-radius: 16px; background: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }
    .logo { display: block; width: 60px; height: 60px; border-radius: 12px; margin: 0 auto 16px; }
    .brand { text-align: center; font-size: 13px; color: #999; margin-bottom: 20px; letter-spacing: 0.5px; }
    h1 { text-align: center; font-size: 22px; margin-bottom: 6px; line-height: 1.3; }
    .description { color: #444; font-size: 0.95rem; line-height: 1.5; margin: 12px 0 20px; white-space: pre-wrap; }
    .meta { display: flex; align-items: center; gap: 8px; color: #555; font-size: 0.9rem; margin: 8px 0; }
    .meta svg { flex-shrink: 0; width: 18px; height: 18px; fill: #34C759; }
    .spots {
      text-align: center; font-size: 0.95rem; font-weight: 600;
      margin: 18px 0; padding: 10px; border-radius: 8px;
    }
    .spots.open { color: #34C759; background: #f0faf3; }
    .spots.full { color: #ff3b30; background: #fff0ef; }
    .divider { border: none; border-top: 1px solid #eee; margin: 20px 0; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: #333; }
    input[type="text"], input[type="email"] {
      width: 100%; padding: 11px 12px; font-size: 16px;
      border: 1px solid #ddd; border-radius: 8px; margin-bottom: 14px;
    }
    input:focus { outline: none; border-color: #34C759; box-shadow: 0 0 0 2px rgba(52,199,89,0.2); }
    .btn {
      display: block; width: 100%; padding: 14px; font-size: 16px; font-weight: 600;
      color: #fff; background: #34C759; border: none; border-radius: 10px; cursor: pointer;
      transition: background 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn:hover:not(:disabled) { background: #2db84d; }
    .error-msg { color: #ff3b30; font-size: 0.9rem; text-align: center; margin-top: 10px; }
    .success-icon { font-size: 48px; text-align: center; margin-bottom: 12px; }
    .success-title { text-align: center; color: #34C759; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .success-text { text-align: center; color: #666; font-size: 0.95rem; }
    .attendees { margin-top: 12px; }
    .attendees-title { font-size: 0.85rem; font-weight: 600; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .attendee { font-size: 0.9rem; padding: 6px 0; color: #333; border-bottom: 1px solid #f0f0f0; }
    .attendee:last-child { border-bottom: none; }
    .loading { text-align: center; padding: 60px 0; color: #999; font-size: 0.95rem; }
    .not-found { text-align: center; padding: 40px 0; }
    .not-found h2 { color: #ff3b30; font-size: 20px; margin-bottom: 8px; }
    .not-found p { color: #666; font-size: 0.95rem; }
    .footer { text-align: center; margin-top: 24px; font-size: 0.8rem; color: #bbb; }
    .footer a { color: #34C759; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div class="loading" id="loading">
      <img src="../stripe/AthleteBridgeLogo.png" alt="AthleteBridge" class="logo" />
      <p>Loading event...</p>
    </div>
  </div>
  <div class="footer">Powered by <a href="https://athletebridge-63176.web.app">AthleteBridge</a></div>

  <script>
    const app = document.getElementById('app');
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get('event');

    if (!eventId) {
      app.innerHTML = `
        <div class="not-found">
          <img src="../stripe/AthleteBridgeLogo.png" alt="AthleteBridge" class="logo" />
          <h2>No Event Specified</h2>
          <p>This link appears to be missing an event ID.</p>
        </div>`;
    } else {
      loadEvent();
    }

    async function loadEvent() {
      try {
        const res = await fetch('/api/signup?event=' + encodeURIComponent(eventId));
        if (res.status === 404) {
          app.innerHTML = `
            <div class="not-found">
              <img src="../stripe/AthleteBridgeLogo.png" alt="AthleteBridge" class="logo" />
              <h2>Event Not Found</h2>
              <p>This event may have been removed or the link is incorrect.</p>
            </div>`;
          return;
        }
        if (!res.ok) throw new Error('Failed to load event');
        const ev = await res.json();
        renderEvent(ev);
      } catch (err) {
        app.innerHTML = `
          <div class="not-found">
            <img src="../stripe/AthleteBridgeLogo.png" alt="AthleteBridge" class="logo" />
            <h2>Something went wrong</h2>
            <p>Unable to load event details. Please try again later.</p>
          </div>`;
      }
    }

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })
        + ' at ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    }

    let currentEvent = null;

    function renderEvent(ev) {
      currentEvent = ev;
      const isFull = ev.signupCount >= ev.maxSignups;
      const spotsLeft = Math.max(0, ev.maxSignups - ev.signupCount);

      let attendeesHtml = '';
      if (ev.signups && ev.signups.length > 0) {
        const items = ev.signups.map(s => `<div class="attendee">${escapeHtml(s.name)}</div>`).join('');
        attendeesHtml = `
          <div class="attendees">
            <div class="attendees-title">Signed Up (${ev.signups.length})</div>
            ${items}
          </div>`;
      }

      const formHtml = isFull ? '' : `
        <hr class="divider" />
        <form id="signupForm" onsubmit="handleSignup(event)">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" required placeholder="Jane Doe" autocomplete="name" />
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="jane@example.com" autocomplete="email" />
          <button type="submit" class="btn" id="submitBtn">Sign Up</button>
          <div id="formError" class="error-msg" style="display:none"></div>
        </form>`;

      app.innerHTML = `
        <img src="../stripe/AthleteBridgeLogo.png" alt="AthleteBridge" class="logo" />
        <div class="brand">ATHLETEBRIDGE</div>
        <h1>${escapeHtml(ev.title)}</h1>
        ${ev.description ? `<div class="description">${escapeHtml(ev.description)}</div>` : ''}
        <div class="meta">
          <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
          <span>${formatDate(ev.eventDate)}</span>
        </div>
        ${ev.placeName ? `<div class="meta">
          <svg viewBox="0 0 24 24"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg>
          <span>${escapeHtml(ev.placeName)}</span>
        </div>` : ''}
        <div class="meta">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1112 6.5a2.5 2.5 0 010 5z"/></svg>
          <span>${escapeHtml(ev.location)}</span>
        </div>
        ${ev.feeUSD ? `<div class="meta">
          <svg viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
          <span>$${Number(ev.feeUSD).toFixed(2)} per player</span>
        </div>` : ''}
        ${ev.recurrence === 'weekly' ? `<div class="meta">
          <svg viewBox="0 0 24 24"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 14.8A5.87 5.87 0 016 12c0-3.31 2.69-6 6-6zm6.76 1.74L17.3 9.2c.44.84.7 1.79.7 2.8 0 3.31-2.69 6-6 6v-3l-4 4 4 4v-3c4.42 0 8-3.58 8-8 0-1.57-.46-3.03-1.24-4.26z"/></svg>
          <span>Repeats weekly</span>
        </div>` : ''}
        <div class="spots ${isFull ? 'full' : 'open'}">
          ${isFull ? 'This event is full' : spotsLeft + ' of ' + ev.maxSignups + ' spots remaining'}
        </div>
        ${formHtml}
        ${attendeesHtml}`;
    }

    async function handleSignup(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('formError');
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();

      btn.disabled = true;
      btn.textContent = 'Signing up...';
      errEl.style.display = 'none';

      try {
        const res = await fetch('/api/signup?event=' + encodeURIComponent(eventId), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          let payHtml = '';
          if (currentEvent && currentEvent.feeUSD) {
            const feeText = '$' + Number(currentEvent.feeUSD).toFixed(2);
            payHtml = currentEvent.paymentLink
              ? `<hr class="divider" /><a class="btn" style="text-decoration:none;text-align:center" href="${escapeHtml(currentEvent.paymentLink)}" target="_blank" rel="noopener">Pay ${feeText} to confirm your spot</a>`
              : `<hr class="divider" /><div class="success-text">Please bring ${feeText} to the event.</div>`;
          }
          app.innerHTML = `
            <img src="../stripe/AthleteBridgeLogo.png" alt="AthleteBridge" class="logo" />
            <div class="brand">ATHLETEBRIDGE</div>
            <div class="success-icon">&#10003;</div>
            <div class="success-title">You're signed up!</div>
            <div class="success-text">${escapeHtml(name)}, you've been registered for this event.</div>
            ${payHtml}`;
        } else {
          errEl.textContent = data.error || 'Something went wrong';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Sign Up';
        }
      } catch (err) {
        errEl.textContent = 'Network error. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign Up';
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }
  </script>
</body>
</html>
