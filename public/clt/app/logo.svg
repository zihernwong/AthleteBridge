<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 38">
  <defs>
    <filter id="cs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="rgba(0,0,0,0.22)"/>
    </filter>
  </defs>

  <!-- Back card -->
  <rect x="0" y="6" width="22" height="29" rx="3"
        fill="rgba(255,255,255,0.18)"
        transform="rotate(-11 11 21)"/>
  <!-- Mid card -->
  <rect x="3" y="4" width="22" height="29" rx="3"
        fill="rgba(255,255,255,0.38)"
        transform="rotate(-4 14 18)"/>
  <!-- Front card -->
  <rect x="7" y="3" width="22" height="29" rx="3" fill="white" filter="url(#cs)"/>

  <!-- Card header line -->
  <rect x="10" y="8"  width="13" height="2"   rx="1"    fill="#5BB8F5"/>
  <rect x="10" y="12" width="9"  height="1.5" rx="0.75" fill="rgba(91,184,245,0.38)"/>

  <!-- Basketball on card -->
  <circle cx="18" cy="24" r="5.5" fill="#5BB8F5"/>
  <path d="M12.5 24 Q18 21 23.5 24" stroke="white" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M12.5 24 Q18 27 23.5 24" stroke="white" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <line x1="18" y1="18.5" x2="18" y2="29.5" stroke="white" stroke-width="0.9" stroke-linecap="round"/>

  <!-- CLT wordmark -->
  <text x="36" y="26"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="900"
        fill="white" letter-spacing="-0.5">CLT</text>
</svg>
